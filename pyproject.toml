[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ssw-aligner"
version = "0.2.0"
description = "SIMD-accelerated Smith-Waterman local aligner (MMseqs2 engine, pure-ctypes Python API)"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.17.0",
]

[project.optional-dependencies]
dev = ["pytest", "blosum", "scikit-bio==0.6.2"]

[tool.poetry]
packages = [
    { include = "ssw_aligner" },
]
include = [
    { path = "ssw_aligner/libssw_aligner.so", format = "wheel" },
]
exclude = [
    "ssw_aligner/libssw_aligner.so",  # generated — not tracked in git
]

[tool.poetry.build]
script = "build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
