[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssw-aligner"
version = "0.2.0"
description = "SIMD-accelerated Smith-Waterman local aligner (MMseqs2 engine, pure-ctypes Python API)"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.17.0",
]

[project.optional-dependencies]
dev = ["pytest", "blosum", "scikit-bio==0.6.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ssw_aligner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
