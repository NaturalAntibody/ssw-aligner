[build-system]
# Building against NumPy 2 produces binaries that work with both NumPy 1.x and 2.x at runtime.
requires = ["scikit-build-core>=0.11", "cython>=3.0", "cython-cmake>=0.2", "numpy>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ssw-aligner-na"
version = "1.0.1"
description = "Standalone StripedSmithWaterman (SSW) aligner extracted from scikit-bio"
readme = "README.md"
authors = [
    { name = "NaturalAntibody" },
    { name = "scikit-bio development team" },
    { name = "Boston College (SSW C library)" },
]
license = "BSD-3-Clause AND MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/NaturalAntibody/ssw-aligner"

[dependency-groups]
dev = ["pytest>=8", "scikit-bio==0.6.2"]
release = ["python-semantic-release~=10.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["ssw_aligner"]
# A persistent build dir makes `uv sync` rebuilds incremental.
build-dir = "build/{wheel_tag}"
sdist.exclude = [".github/"]
# C/Cython sources belong in the sdist only; the wheel ships the compiled module.
wheel.exclude = ["ssw_aligner/**.pyx", "ssw_aligner/_lib/*.c", "ssw_aligner/_lib/*.h"]

[tool.uv]
# Reinstall (and so rebuild) the editable project when the C/Cython sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "ssw_aligner/**/*.pyx" },
    { file = "ssw_aligner/**/*.c" },
    { file = "ssw_aligner/**/*.h" },
]

[tool.cibuildwheel]
# Same interpreters as riot_na's wheels: CPython 3.10-3.15 and PyPy 3.11.
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp315-*", "pp311-*"]
skip = ["*-musllinux_*", "*-win32"]
enable = ["pypy"]
build-frontend = "build[uv]"
test-requires = ["pytest"]
test-sources = ["tests"]
# test_regression.py compares against scikit-bio, which only the dev group installs.
test-command = "pytest tests/test_aligners.py"

[tool.cibuildwheel.macos]
archs = ["universal2"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
# uv.lock records the project version, so refresh it in the release commit.
# The real build happens later in CI (cibuildwheel + uv build --sdist).
build_command = "uv lock --upgrade-package ssw-aligner-na && git add uv.lock"
commit_message = "bump: {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["ssw_aligner/__init__.py:__version__"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "docs", "build"]
